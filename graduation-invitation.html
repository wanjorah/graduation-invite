<style>
/* Layout: one tall paper card centred on a deep green ground; a two-panel gate opens over it, then gold confetti. */
:root {
  --ground: #0b2a8c;
  --ground-2: #1b47c9;
  --paper: #f6f7fb;
  --ink: #0b2160;
  --muted: #475690;
  --gold: #ffc72c;
  --gold-soft: #ffd96a;
  --seal: #0b2a8c;
  --display: "Bodoni Moda", "Didot", "Times New Roman", serif;
  --body: "Hanken Grotesk", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background: var(--ground);
  background-image:
    radial-gradient(1200px 700px at 50% -10%, var(--ground-2), transparent 70%),
    radial-gradient(circle at 1px 1px, rgba(255,217,106,.12) 1px, transparent 0);
  background-size: auto, 26px 26px;
  color: var(--ink);
  font-family: var(--body);
  padding-block: 28px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  overflow-x: hidden;
}
.stage { max-width: 540px; margin: 0 auto; }

/* ---------- card ---------- */
.card {
  position: relative;
  background: var(--paper);
  padding: 14px;
  box-shadow: 0 30px 80px rgba(0,0,0,.45), 0 2px 0 var(--gold-soft) inset;
}
.card::before {
  content: ""; position: absolute; inset: 7px;
  border: 1px solid var(--gold); pointer-events: none;
}
.inner {
  border: 1px solid var(--ink);
  padding: 36px 22px 28px;
  display: flex; flex-direction: column; align-items: center; gap: 22px;
  text-align: center;
  min-width: 0;
}
.code {
  font-family: var(--mono); font-size: 12px; color: var(--muted);
  letter-spacing: .02em; margin: 0; max-width: 100%;
  overflow-wrap: anywhere;
}
.code b { color: var(--seal); font-weight: 500; }
.college { font-weight: 700; letter-spacing: .24em; text-transform: uppercase; font-size: 13px; margin: 0; color: var(--ink); }
.photo { width: 100%; max-width: 420px; height: auto; display: block; border: 3px solid var(--gold); box-shadow: 0 0 0 1px var(--ink); }
.phone { font-family: var(--mono); font-size: 1.25rem; font-weight: 500; letter-spacing: .04em; margin: 0; user-select: all; }
.inquire { font-size: 11px; letter-spacing: .24em; text-transform: uppercase; color: var(--muted); margin: 0; font-weight: 600; }
.eyebrow {
  font-size: 12px; letter-spacing: .28em; text-transform: uppercase;
  color: var(--muted); margin: 0; font-weight: 600;
}
.cap { width: 92px; height: auto; display: block; }
.cap .tassel { transform-origin: 108px 38px; animation: swing 3.6s ease-in-out infinite; }
@keyframes swing { 0%,100% { transform: rotate(-5deg); } 50% { transform: rotate(6deg); } }

.name {
  font-family: var(--display); font-style: italic; font-weight: 500;
  font-size: clamp(2.4rem, 11vw, 3.6rem); line-height: 1.02;
  margin: 0; text-wrap: balance; letter-spacing: -.01em;
}
.degree { margin: 0; display: flex; flex-direction: column; gap: 4px; }
.degree .d1 { font-family: var(--display); font-weight: 700; font-size: 1.15rem; text-wrap: balance; }
.degree .d2 { font-size: .95rem; color: var(--muted); }
.rule { width: 64px; height: 1px; background: var(--gold); border: 0; margin: 0; }

.when { display: flex; flex-direction: column; gap: 6px; align-items: center; }
.when .dow { font-size: 12px; letter-spacing: .3em; text-transform: uppercase; font-weight: 700; color: var(--ink); background: var(--gold); padding: 5px 14px; }
.when .big {
  font-family: var(--display); font-weight: 700; font-size: clamp(2.2rem, 10vw, 3rem);
  line-height: 1; font-variant-numeric: lining-nums;
}
.when .time { font-family: var(--mono); font-size: .95rem; }
.where { display: flex; flex-direction: column; gap: 2px; }
.where .venue { font-weight: 600; font-size: 1.05rem; }
.where .town { color: var(--muted); font-size: .95rem; }

.count {
  display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px;
  width: 100%; max-width: 380px;
}
.count div { border-top: 2px solid var(--ink); padding-top: 8px; }
.count .n { font-family: var(--mono); font-size: 1.7rem; font-weight: 500; font-variant-numeric: tabular-nums; display: block; line-height: 1.1; }
.count .l { font-size: 10px; letter-spacing: .22em; text-transform: uppercase; color: var(--muted); }
.count-note { font-family: var(--mono); font-size: 12px; color: var(--muted); margin: 0; }

.run { width: 100%; max-width: 380px; text-align: left; display: flex; flex-direction: column; }
.run h3 { font-size: 11px; letter-spacing: .26em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; font-weight: 600; text-align: center; }
.run ol { list-style: none; margin: 0; padding: 0; border-top: 1px solid rgba(11,33,96,.22); }
.run li { display: grid; grid-template-columns: 5.2em 1fr; gap: 12px; padding: 9px 0; border-bottom: 1px solid rgba(11,33,96,.22); align-items: baseline; }
.run .t { font-family: var(--mono); font-size: .9rem; font-variant-numeric: tabular-nums; }
.run .a { font-size: .98rem; min-width: 0; }

.dress { margin: 0; font-size: .95rem; max-width: 34ch; text-wrap: balance; }
.dress b { font-weight: 600; }

.actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; width: 100%; }
.btn {
  font: 600 .95rem var(--body); letter-spacing: .02em;
  border: 1px solid var(--ink); background: var(--ink); color: var(--paper);
  padding: 13px 20px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center;
  min-height: 46px; flex: 1 1 150px; max-width: 240px;
  transition: transform .15s ease, background .15s ease, color .15s ease;
}
.btn:hover { transform: translateY(-2px); }
.btn.alt { background: transparent; color: var(--ink); }
.btn.alt:hover { background: var(--ink); color: var(--paper); }
.btn:focus-visible, .seal:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
.rsvp-by { font-size: .85rem; color: var(--muted); margin: 0; }
.toast { font-family: var(--mono); font-size: 12px; min-height: 1.2em; color: var(--ink); margin: 0; }

.foot { text-align: center; color: var(--gold-soft); font-family: var(--mono); font-size: 12px; margin: 22px 0 0; }
.celebrate {
  display: block; margin: 16px auto 0; background: none; border: 1px solid var(--gold); color: var(--gold-soft);
  font: 500 12px var(--mono); letter-spacing: .12em; text-transform: uppercase; padding: 10px 16px; cursor: pointer;
}
.celebrate:hover { background: var(--gold); color: var(--ground); }
.celebrate:focus-visible { outline: 3px solid var(--gold-soft); outline-offset: 3px; }

/* ---------- entrance (only runs once the gate opens) ---------- */
body.open .inner > * { animation: rise .8s cubic-bezier(.2,.7,.2,1) both; }
body.open .inner > *:nth-child(1) { animation-delay: .35s; }
body.open .inner > *:nth-child(2) { animation-delay: .45s; }
body.open .inner > *:nth-child(3) { animation-delay: .55s; }
body.open .inner > *:nth-child(4) { animation-delay: .65s; }
body.open .inner > *:nth-child(5) { animation-delay: .75s; }
body.open .inner > *:nth-child(6) { animation-delay: .85s; }
body.open .inner > *:nth-child(7) { animation-delay: .95s; }
body.open .inner > *:nth-child(n+8) { animation-delay: 1.05s; }
@keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }

/* ---------- gate ---------- */
.gate { position: fixed; inset: 0; z-index: 50; }
.gate.gone { display: none; }
.panel {
  position: absolute; left: 0; right: 0; height: 50%;
  background: var(--ground);
  background-image: radial-gradient(circle at 1px 1px, rgba(255,217,106,.16) 1px, transparent 0);
  background-size: 26px 26px;
  transition: transform 1s cubic-bezier(.7,0,.2,1);
}
.panel.top { top: 0; border-bottom: 1px solid var(--gold); }
.panel.bot { bottom: 0; border-top: 1px solid var(--gold); }
.gate.opening .top { transform: translateY(-101%); }
.gate.opening .bot { transform: translateY(101%); }
.seal-wrap {
  position: absolute; inset: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 22px; padding: 16px; text-align: center;
  transition: opacity .35s ease, transform .5s ease;
}
.gate.opening .seal-wrap { opacity: 0; transform: scale(1.3); pointer-events: none; }
.seal {
  width: 112px; height: 112px; border-radius: 50%; border: 0; cursor: pointer; color: var(--ink);
  background: radial-gradient(circle at 35% 30%, #ffe28a, var(--gold) 55%, #c8951a);
  box-shadow: 0 10px 30px rgba(0,0,0,.5), inset 0 0 0 5px rgba(0,0,0,.12), inset 0 0 0 7px rgba(255,255,255,.3);
  font-family: var(--display); font-style: italic; font-size: 2.2rem; font-weight: 500;
  animation: pulse 2.2s ease-in-out infinite;
}
@keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
.gate-line { font-family: var(--mono); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--gold-soft); margin: 0; }
.gate-hello { font-family: var(--display); font-style: italic; font-size: 1.5rem; color: var(--paper); margin: 0; text-wrap: balance; }

canvas#fx { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 60; pointer-events: none; }

@media (max-width: 380px) {
  .inner { padding-inline: 14px; }
  .count .n { font-size: 1.4rem; }
}
@media (prefers-reduced-motion: reduce) {
  .seal, .cap .tassel { animation: none; }
  body.open .inner > * { animation: none; }
  .panel, .seal-wrap { transition: none; }
}
</style>

<div class="gate" id="gate">
  <div class="panel top"></div>
  <div class="panel bot"></div>
  <div class="seal-wrap">
    <p class="gate-hello">You are invited</p>
    <button class="seal" id="seal" type="button" aria-label="Open the invitation"><span id="monogram">G</span></button>
    <p class="gate-line">Tap the seal to open</p>
  </div>
</div>

<canvas id="fx" aria-hidden="true"></canvas>

      <h1 class="name" id="name"></h1>

      <p class="degree">
        <span class="d1" id="degree"></span>
        <span class="d2" id="school"></span>
      </p>

      <hr class="rule">

      <div class="when">
        <span class="dow" id="dow"></span>
        <span class="big" id="bigdate"></span>
        <span class="time" id="timeText"></span>
      </div>

      <div class="where">
        <span class="venue" id="venue"></span>
        <span class="town" id="town"></span>
      </div>

      <div class="count" id="count" aria-live="off">
        <div><span class="n" id="cd-d">--</span><span class="l">Days</span></div>
        <div><span class="n" id="cd-h">--</span><span class="l">Hours</span></div>
        <div><span class="n" id="cd-m">--</span><span class="l">Mins</span></div>
        <div><span class="n" id="cd-s">--</span><span class="l">Secs</span></div>
      </div>
      <p class="count-note" id="countNote"></p>

      <div class="run" id="runBox">
        <h3>Programme for the day</h3>
        <ol id="program"></ol>
      </div>

      <p class="dress" id="dress" hidden></p>

      <div class="actions">
        <a class="btn" id="rsvp" href="#" target="_blank" rel="noopener">Confirm on WhatsApp</a>
        <button class="btn alt" id="copy" type="button">Copy the details</button>
      </div>
      <p class="toast" id="toast" role="status"></p>
      <p class="inquire" id="inquire"></p>
      <p class="phone" id="phone"></p>
    </div>
  </article>

  <p class="foot" id="foot"></p>
  <button class="celebrate" id="celebrate" type="button">Celebrate</button>
</main>

<script>
/* ============================================================
   EDIT THIS BLOCK. Everything on the invitation comes from here.
   ============================================================ */
var CONFIG = {
  name: "Brian Wanjorah Mwaniki",
  college: "Mwangaza College",
  ceremony: "31st Graduation Ceremony",
  place: "Graduation Grounds",
  tagline: "duties.fulfill({ well: true }); // our motto",
  // Local Kenyan time (EAT, UTC+3). Format: YYYY-MM-DDTHH:MM:SS+03:00
  dateTime: "2026-12-05T00:00:00+03:00",
  showTime: false,          // set true and add the hour above once it is confirmed
  program: [],              // e.g. [{ time: "10:00", what: "Graduation ceremony" }]
  dress: "",                // e.g. "Dress code: smart, with a touch of blue."
  phoneDisplay: "0757 429 047",
  whatsappNumber: "254757429047",
  footer: "Fulfill well your duties."
};

/* ---------------- fill the page ---------------- */
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var when = new Date(CONFIG.dateTime);
  var tz = "Africa/Nairobi";
  var fmt = function (o) { return new Intl.DateTimeFormat("en-GB", Object.assign({ timeZone: tz }, o)).format(when); };

  $("college").textContent = CONFIG.college;
  $("tagline").innerHTML = CONFIG.tagline.replace("fulfill", "<b>fulfill</b>");
  $("name").textContent = CONFIG.name;
  $("degree").textContent = CONFIG.ceremony;
  $("school").textContent = "";
  $("monogram").textContent = (CONFIG.name.trim().charAt(0) || "G").toUpperCase();
  $("dow").textContent = fmt({ weekday: "long" });
  $("bigdate").textContent = fmt({ day: "numeric", month: "long", year: "numeric" });
  $("timeText").textContent = CONFIG.showTime ? fmt({ hour: "2-digit", minute: "2-digit", hour12: false }) + " EAT" : "";
  $("venue").textContent = "At " + CONFIG.college;
  $("town").textContent = CONFIG.place;
  if (CONFIG.dress) { $("dress").hidden = false; $("dress").innerHTML = CONFIG.dress.replace(/^(Dress code:)/, "<b>$1</b>"); }
  if (!CONFIG.program.length) { $("runBox").hidden = true; }
  $("inquire").textContent = "For inquiries call / WhatsApp";
  $("phone").textContent = CONFIG.phoneDisplay;
  $("foot").textContent = CONFIG.footer;
  document.title = "Graduation Day 2026";

  var ol = $("program");
  CONFIG.program.forEach(function (p) {
    var li = document.createElement("li");
    var t = document.createElement("span"); t.className = "t"; t.textContent = p.time;
    var a = document.createElement("span"); a.className = "a"; a.textContent = p.what;
    li.appendChild(t); li.appendChild(a); ol.appendChild(li);
  });

  var summary = "You are cordially invited to celebrate the graduation of " + CONFIG.name + ".\n" +
    CONFIG.ceremony + ", " + CONFIG.college + "\n" +
    fmt({ weekday: "long", day: "numeric", month: "long", year: "numeric" }) + "\n" +
    "At " + CONFIG.college + ", " + CONFIG.place + "\n" +
    "Inquiries: " + CONFIG.phoneDisplay + " (call / WhatsApp)";

  var msg = "Hello Brian, I received your graduation invitation for " +
    fmt({ day: "numeric", month: "long" }) + " and I will attend. Number of guests: ";
  $("rsvp").href = "https://wa.me/" + CONFIG.whatsappNumber + "?text=" + encodeURIComponent(msg);

  var toastTimer;
  function toast(t) {
    $("toast").textContent = t;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { $("toast").textContent = ""; }, 2600);
  }
  $("copy").addEventListener("click", function () {
    var done = function () { toast("Details copied."); };
    var fallback = function () {
      var ta = document.createElement("textarea");
      ta.value = summary; ta.setAttribute("readonly", "");
      ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      var ok = false;
      try { ok = document.execCommand("copy"); } catch (e) {}
      document.body.removeChild(ta);
      ok ? done() : toast("Select and copy the details by hand.");
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(summary).then(done, fallback);
    } else { fallback(); }
  });

  /* ---------------- countdown ---------------- */
  var pad = function (n) { return String(n).padStart(2, "0"); };
  function tick() {
    var diff = when.getTime() - Date.now();
    if (diff <= 0) {
      ["d","h","m","s"].forEach(function (k) { $("cd-" + k).textContent = "00"; });
      $("countNote").textContent = diff > -86400000 ? "Graduation day is here." : "Thank you for celebrating with me.";
      return;
    }
    var s = Math.floor(diff / 1000);
    $("cd-d").textContent = pad(Math.floor(s / 86400));
    $("cd-h").textContent = pad(Math.floor(s % 86400 / 3600));
    $("cd-m").textContent = pad(Math.floor(s % 3600 / 60));
    $("cd-s").textContent = pad(s % 60);
    $("countNote").textContent = "until graduation day";
  }
  tick(); setInterval(tick, 1000);
})();

/* ---------------- confetti ---------------- */
var fx = (function () {
  var cv = document.getElementById("fx"), ctx = cv.getContext("2d");
  var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  var parts = [], running = false, dpr = 1;
  var colors = ["#c39a3f", "#e3c77e", "#f0f2ec", "#4a78ff", "#ffffff"];
  function size() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
  }
  size(); addEventListener("resize", size);
  function burst(n) {
    if (reduce) return;
    var w = innerWidth, h = innerHeight;
    for (var i = 0; i < n; i++) {
      var left = i % 2 === 0;
      parts.push({
        x: left ? w * 0.1 : w * 0.9, y: h * 0.78,
        vx: (left ? 1 : -1) * (2 + Math.random() * 7), vy: -(9 + Math.random() * 11),
        w: 6 + Math.random() * 7, h: 9 + Math.random() * 9,
        rot: Math.random() * 6.28, vr: (Math.random() - .5) * .35,
        c: colors[(Math.random() * colors.length) | 0], life: 0
      });
    }
    if (!running) { running = true; requestAnimationFrame(loop); }
  }
  function loop() {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, cv.width, cv.height);
    ctx.scale(dpr, dpr);
    parts = parts.filter(function (p) { return p.y < innerHeight + 40 && p.life < 420; });
    parts.forEach(function (p) {
      p.vy += 0.32; p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life++;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.abs(Math.cos(p.rot * 2)) + 2);
      ctx.restore();
    });
    if (parts.length) { requestAnimationFrame(loop); }
    else { running = false; ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, cv.width, cv.height); }
  }
  return { burst: burst };
})();

/* ---------------- gate ---------------- */
(function () {
  var gate = document.getElementById("gate"), opened = false;
  function open() {
    if (opened) return; opened = true;
    gate.classList.add("opening");
    document.body.classList.add("open");
    setTimeout(function () { fx.burst(110); }, 450);
    setTimeout(function () { gate.classList.add("gone"); }, 1200);
  }
  document.getElementById("seal").addEventListener("click", open);
  gate.addEventListener("click", open);
  setTimeout(open, 3200);
  document.getElementById("celebrate").addEventListener("click", function () { fx.burst(130); });
})();
</script>
